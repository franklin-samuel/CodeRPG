spring.application.name=coderpg
spring.profiles.active=${SPRING_PROFILE:dev}

# Server
server.port=${SPRING_SERVER_PORT}
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# GitHub API Configuration
github.api-url=https://api.github.com
github.app-id=${GITHUB_APP_ID:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
github.request-timeout=30000
github.max-retries=3
github.enable-webhooks=true

#OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user,repo,read:org,admin:repo_hook
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI}
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Hikari Pool Configuration
spring.datasource.host=${SPRING_DATASOURCE_HOST}
spring.datasource.port=${SPRING_DATASOURCE_PORT}
spring.datasource.name=${SPRING_DATASOURCE_NAME}
spring.datasource.hikari.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.hikari.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# FlyWay
spring.flyway.enabled=false

# Management Endpoints (Actuator)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.info.env.enabled=true
management.prometheus.metrics.export.enabled=true
info.app.name=CodeRPG API
info.app.description=RPG-style developer social network with GitHub integration
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.validator=DEBUG



