services:
  postgres:
    image: postgres:17
    container_name: postgres-db-coderpg
    restart: always
    environment:
      POSTGRES_DB: coderpg_db
      POSTGRES_USER: coderpg
      POSTGRES_PASSWORD: coderpg
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coderpg-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_HOST: postgres
      SPRING_DATASOURCE_PORT: 5433
      SPRING_DATASOURCE_NAME: coderpg_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: coderpg
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5433/coderpg
      SPRING_SERVER_PORT: 8080
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      - postgres

volumes:
  postgres_data: