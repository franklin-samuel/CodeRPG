services:
  postgres:
    image: postgres:17
    container_name: postgres-db-coderpg
    restart: always
    environment:
      POSTGRES_DB: coderpg_db
      POSTGRES_USER: coderpg
      POSTGRES_PASSWORD: coderpg
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: